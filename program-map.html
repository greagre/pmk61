<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmk61 · карта программы — блок-схема и листинг</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 12px; background: #f6f7f9; color: #1c1f24; }
  h1 { font-size: 18px; margin: 2px 0 6px; }
  .lead { font-size: 13px; color: #5b6270; line-height: 1.45; margin-bottom: 12px; }
  .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 12px;
          padding: 10px; margin-bottom: 12px; }
  label.lb { font-size: 12px; color: #5b6270; display: block; margin-bottom: 5px; }
  textarea { width: 100%; min-height: 66px; font-family: ui-monospace, Menlo, Consolas, monospace;
             font-size: 14px; padding: 9px; border: 1px solid #cfd4dc; border-radius: 9px;
             resize: vertical; background: #fbfcfd; color: #1c1f24; }
  select { font-size: 14px; padding: 7px 9px; border: 1px solid #cfd4dc;
           border-radius: 9px; background: #fff; width: 100%; }
  .views { display: flex; gap: 8px; margin: 10px 0 4px; }
  .views button { flex: 1; font-size: 14px; padding: 10px 8px; border-radius: 10px;
                  border: 1px solid #cfd4dc; background: #fff; color: #1c1f24;
                  font-weight: 600; cursor: pointer; }
  .views button.on { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .hint { font-size: 12px; color: #6b7280; margin: 6px 0 0; line-height: 1.4; }
  .chk { display: flex; align-items: flex-start; gap: 8px; font-size: 13px;
         color: #3b4048; margin-top: 9px; line-height: 1.35; }
  .chk input { margin-top: 2px; }
  .sum { font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 9px;
         background: #eef2fb; color: #24468f; margin-bottom: 10px; }
  .msg { font-size: 13px; color: #6b7280; padding: 10px; }
  .fix { font-size: 12px; padding: 8px 10px; border-radius: 9px; background: #fff5e6;
         color: #8a5a05; margin-bottom: 10px; line-height: 1.45; }
  .warn { font-size: 12px; padding: 8px 10px; border-radius: 9px; background: #fdeaea;
          color: #a92a2a; margin-bottom: 10px; line-height: 1.5; }
  .bad { font-size: 12px; padding: 8px 10px; border-radius: 9px; background: #fff5e6;
         color: #8a5a05; margin-bottom: 10px; }

  svg.map { width: 100%; height: auto; display: block; background: #fbfcfd;
            border: 1px solid #e6e9ee; border-radius: 10px; }

  .blk { border: 1px solid #e2e5ea; border-radius: 10px; overflow: hidden;
         margin-bottom: 9px; background: #fff; }
  .bh { font: 700 12px system-ui, sans-serif; color: #5b6270; background: #f2f4f7;
        padding: 6px 10px; }
  .row { display: flex; gap: 10px; padding: 3px 10px;
         font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .row .a { color: #9aa1ad; min-width: 22px; }
  .row .c { color: #1c1f24; }
  .row .cells { color: #9aa1ad; font-size: 12px; }
  .row.addr { padding-top: 0; }
  .row.addr .a, .row.addr .c { color: #9aa1ad; font-size: 12px; }
  .jump { font-size: 12px; padding: 5px 10px 6px 42px; color: #24468f;
          background: #eef2fb; border-top: 1px dashed #d5deef; }
  .jump.back { color: #a35f06; background: #fff5e6; border-top-color: #f0d8b4; }
  pre.mm { font: 12px ui-monospace, Menlo, monospace; background: #1c1f24; color: #e6e9ee;
           padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre; }
  .btn2 { font-size: 13px; padding: 8px 12px; border-radius: 9px; border: 1px solid #cfd4dc;
          background: #fff; color: #1c1f24; cursor: pointer; }
  .foot { font-size: 12px; color: #8a909c; line-height: 1.5; margin-top: 8px; }
</style>
</head>
<body>

<h1>Карта программы</h1>
<div class="lead">
  Два вида одной программы: <b>блок-схема</b> показывает устройство, <b>листинг</b> —
  точную запись с адресами. Считать всё равно будет эмулятор: карта раскрывает идею,
  а не выполняет её.
</div>

<div class="card">
  <label class="lb">Коды программы</label>
  <textarea id="ta" spellcheck="false"></textarea>

  <label class="lb" style="margin-top:9px">Готовый пример</label>
  <select id="ex">
    <option value="loop">Вечный цикл</option>
    <option value="cond">Ветвление: если ноль — в обход</option>
    <option value="fl0">Как в журнале: FL0 03 одним числом</option>
  </select>

  <label class="chk">
    <input type="checkbox" id="fix" checked>
    <span>как в журнале: адрес перехода — <b>одно</b> число (<code>5E 03</code> → <code>5E 00 03</code>)</span>
  </label>
  <div class="hint" id="modehint"></div>

  <div class="views">
    <button id="vMap" class="on" title="Блок-схема">Схема</button>
    <button id="vList" title="Листинг — список команд">Листинг</button>
  </div>
  <div class="hint" id="vhint"></div>
</div>

<div id="out"></div>

<div class="card">
  <button class="btn2" id="mmBtn">Скопировать граф для чата</button>
  <div id="mmBox"></div>
</div>

<div class="foot">Открывать со <code>?v=5</code>, иначе браузер покажет старую версию из кэша.</div>

<script src="core.js?v=14"></script>
<script src="disasm61.js?v=8"></script>
<script src="analyze61.js?v=2"></script>
<script src="codes-addr.js?v=3"></script>
<script src="map-view.js?v=2"></script>
<script>
(function () {
  'use strict';

  var A = window.MKCodeAddr;
  var AN = window.MKAnalyze;
  var MV = window.MKMap;

  var ta = document.getElementById('ta');
  var ex = document.getElementById('ex');
  var cb = document.getElementById('fix');
  var out = document.getElementById('out');
  var vhint = document.getElementById('vhint');
  var modehint = document.getElementById('modehint');
  var bMap = document.getElementById('vMap');
  var bList = document.getElementById('vList');
  var mmBtn = document.getElementById('mmBtn');
  var mmBox = document.getElementById('mmBox');

  /* Примеры записаны «по-журнальному»: адрес перехода — одно число. */
  var EX = {
    loop: '01 02 51 0',
    cond: '5A 06 01 02 03 50',
    fl0:  '5E 05 01 02 51 0'
  };

  var view = 'map';
  var last = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function pad(n) {
    n = Number(n) | 0;
    if (n < 0) return '??';
    return n < 10 ? '0' + n : String(n);
  }

  function lastCellOf(an, b) {
    if (MV && MV.lastCell) return MV.lastCell(an, b);
    return b.end;
  }

  /* ---------- листинг ---------- */
  function drawList(an) {
    if (!an.blocks.length) return '<div class="msg">Участков нет.</div>';
    var h = [];
    for (var i = 0; i < an.blocks.length; i++) {
      var b = an.blocks[i];
      h.push('<div class="blk"><div class="bh">Участок ' + (b.n + 1) +
             ' · адреса ' + pad(b.start) + '–' + pad(lastCellOf(an, b)) + '</div>');
      for (var q = b.fromIndex; q <= b.toIndex; q++) {
        var r = an.rows[q];
        if (!r) continue;
        var len = (r.len > 0) ? r.len : 1;
        var cells = (len > 1)
          ? ' <span class="cells">(' + pad(r.addr) + '–' + pad(r.addr + len - 1) + ')</span>'
          : '';
        h.push('<div class="row"><span class="a">' + pad(r.addr) +
               '</span><span class="c">' + esc(r.text || '—') + cells + '</span></div>');
        if (len > 1) {
          var shownAs = false;
          for (var k = b.fromIndex; k <= b.toIndex; k++) {
            if (an.rows[k] && an.rows[k].addr === r.addr + 1) shownAs = true;
          }
          if (!shownAs) {
            h.push('<div class="row addr"><span class="a">' + pad(r.addr + 1) + '–' +
                   pad(r.addr + len - 1) + '</span><span class="c">адрес перехода</span></div>');
          }
        }
      }
      for (var e = 0; e < an.edges.length; e++) {
        var ed = an.edges[e];
        if (ed.from !== b.n) continue;
        h.push('<div class="jump' + (ed.back ? ' back' : '') + '">' +
               (ed.back ? '↺ назад на ' : '→ на ') + pad(ed.target) + ' · ' + esc(ed.name) + '</div>');
      }
      h.push('</div>');
    }
    return h.join('');
  }

  function render() {
    var r = A.parse(ta.value, { fixAddr: cb.checked });
    last = null;

    modehint.textContent = cb.checked
      ? 'Режим «как в журнале»: после перехода читается один адрес. Если нужна запись двумя ячейками — снимите галочку.'
      : 'Строгий режим: каждый байт отдельно, адрес надо писать двумя ячейками — 5E 00 03.';

    var html = '';

    if (r.bad.length) {
      html += '<div class="bad">Не поняла это и пропустила: <b>' +
              esc(r.bad.join(', ')) + '</b></div>';
    }

    if (!r.bytes.length) {
      out.innerHTML = html + '<div class="msg">Нет кодов — введите байты через пробел, например <code>01 02 51 0</code>.</div>';
      return;
    }

    var an = AN.analyze(r.bytes);
    last = an;

    if (r.fixes.length) {
      var parts = [];
      for (var i = 0; i < r.fixes.length; i++) {
        parts.push('«' + r.fixes[i].raw + '» → ' + r.fixes[i].to);
      }
      html += '<div class="fix">Адрес был записан одним числом, развернула в две ячейки: ' +
              esc(parts.join('; ')) + '</div>';
    }

    html += '<div class="sum">' + an.size + ' яч. · участков ' + an.blocks.length +
            ' · переходов ' + an.edges.length + ' · циклов ' + an.loops.length +
            ' · замечаний ' + an.warnings.length + '</div>';

    if (an.warnings.length) {
      var w = [];
      for (var j = 0; j < an.warnings.length; j++) {
        w.push(pad(an.warnings[j].addr) + ' — ' + esc(an.warnings[j].text));
      }
      html += '<div class="warn">' + w.join('<br>') + '</div>';
    }

    if (an.size === 0) {
      html += '<div class="msg">Пустая программа: только пустые шаги. Собирать нечего.</div>';
      out.innerHTML = html;
      return;
    }

    html += (view === 'map') ? '<div id="mapBox"></div>' : drawList(an);
    out.innerHTML = html;

    if (view === 'map') {
      var box = document.getElementById('mapBox');
      if (box) MV.render(box, an, { width: (out.clientWidth || 340) - 10 });
    }
  }

  function setView(v) {
    view = v;
    bMap.className = (v === 'map') ? 'on' : '';
    bList.className = (v === 'list') ? 'on' : '';
    vhint.textContent = (v === 'map')
      ? 'Блок-схема: видно, как программа устроена и куда ведут переходы.'
      : 'Листинг: каждая команда с адресом — удобно сверять с журналом.';
    render();
  }

  bMap.onclick = function () { setView('map'); };
  bList.onclick = function () { setView('list'); };
  ta.oninput = render;
  cb.onchange = render;
  ex.onchange = function () { ta.value = EX[ex.value]; render(); };

  mmBtn.onclick = function () {
    if (!last) { mmBox.innerHTML = '<div class="msg">Сначала введите программу.</div>'; return; }
    var text = (AN.mermaid ? AN.mermaid(last) : MV.mermaid(last));
    var ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) { ok = false; }
    mmBox.innerHTML = '<pre class="mm">' + esc(text) + '</pre>' +
      '<div class="hint">' + (ok ? 'Скопировано. ' : '') +
      'Вставьте в чат Honer AI — он нарисует граф картинкой.</div>';
  };

  ta.value = EX.loop;
  setView('map');
})();
</script>
</body>
</html>
