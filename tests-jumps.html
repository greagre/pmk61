<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Порядок условных переходов · pmk61</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 16px; background: #f2efe6; color: #24211c; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b655a; margin-bottom: 12px; line-height: 1.45; }
  .sum { font-size: 15px; font-weight: 600; padding: 10px 12px; border-radius: 10px;
         background: #e6e1d3; margin-bottom: 12px; }
  .sum.ok { background: #d9efdc; color: #1b5e20; }
  .sum.bad { background: #f7dcdc; color: #8e1b1b; }
  .card { border: 1px solid #cfc8b6; border-radius: 10px; padding: 10px 12px;
          margin-bottom: 10px; background: #fbf9f3; }
  .card h2 { font-size: 14px; margin: 0 0 6px; }
  .card pre { margin: 6px 0; padding: 8px; background: #ece7d8; border-radius: 6px;
              font-family: ui-monospace, Menlo, monospace; font-size: 12px;
              line-height: 1.5; overflow-x: auto; white-space: pre; }
  .card .x { font-size: 13px; margin: 4px 0; }
  .card .x b { font-family: ui-monospace, Menlo, monospace; }
  .flag { display: inline-block; font-size: 13px; font-weight: 700;
          padding: 3px 8px; border-radius: 6px; margin-top: 4px; }
  .flag.yes { background: #d9efdc; color: #1b5e20; }
  .flag.no  { background: #f7dcdc; color: #8e1b1b; }
  .flag.err { background: #fff0c2; color: #7a5200; }
  .err { display: block; color: #8e1b1b; font-size: 12px; margin-top: 4px;
         font-family: ui-monospace, Menlo, monospace; }
  table { border-collapse: collapse; width: 100%; margin-top: 14px; font-size: 13px; }
  th, td { border: 1px solid #cfc8b6; padding: 5px 6px; text-align: left; }
  th { background: #e6e1d3; font-size: 12px; }
  td.yes { background: #d9efdc; font-weight: 700; color: #1b5e20; }
  td.no { background: #f7dcdc; font-weight: 700; color: #8e1b1b; }
  td.err { background: #fff0c2; color: #7a5200; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>Порядок условных переходов</h1>
<div class="sub">
  Каждая карточка — своя программа, собранная настоящим ассемблером
  и прогнанная на настоящем ядре. В R9 заранее кладём <b>111</b>.
  Если переход сработал, программа запишет туда <b>222</b>.
  Что в R9 — то и ответ: сработал переход или нет.
</div>
<div class="sum" id="sum">Считаю…</div>
<div id="cards"></div>
<table id="tbl">
  <thead><tr><th>Условие</th><th>X</th><th>R9</th><th>Переход</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script src="core.js?v=14"></script>
<script src="ext61.js?v=11"></script>
<script src="asm61.js?v=5"></script>
<script src="asm-editor.js?v=6"></script>
<script>
(function () {
  'use strict';

  var cards = document.getElementById('cards');
  var tbody = document.getElementById('tbody');
  var sum   = document.getElementById('sum');

  var PAGE_SIZE = 105;
  var PAGES = 4;
  var LEN = PAGE_SIZE * PAGES;

  function makeExt() {
    return MKExt61.create({
      progLen: PAGE_SIZE,
      regCount: 15,
      addrHigh: true,
      addrHighFirst: 100,
      addrHighLast: 104
    });
  }

  function build(ext, text) {
    return MKAsmEditor.buildProgram(text, {
      core: ext.core,
      len: LEN,
      pageSize: PAGE_SIZE,
      pages: PAGES
    });
  }

  function show(v) {
    if (typeof v !== 'number') return String(v);
    return String(Math.round(v * 1e8) / 1e8);
  }

  /* Текст программы для одного случая.

     Порядок строк объясню: сначала кладём 111 в R9 (три отдельные
     строки «1», иначе «111» развернётся в те же три команды-цифры —
     так тоже работает, но так виднее, что это трёхзначное число).
     Потом кладём X. Потом УСЛОВИЕ. Если оно срабатывает по правилу
     «выполнено → прыжок», программа прыгнет на метку NEXT и запишет 222.
     Если не срабатывает — пойдёт по порядку на 111 и на БП DONE.

     Метки NEXT и DONE ставит ассемблер, поэтому адреса считать
     не надо вообще — это главная причина, почему прошлая версия
     страницы была негодной: она пыталась угадать числа. */
  function src(cond, xLines) {
    var lines = [];
    lines.push('; в R9 кладём 111 — метка «переход не сработал»');
    lines.push('1');
    lines.push('1');
    lines.push('1');
    lines.push('X→П 9');
    lines.push('; теперь X = то, что проверяем');
    for (var i = 0; i < xLines.length; i++) lines.push(xLines[i]);
    lines.push('; вот проверяемое условие');
    lines.push(cond + ' NEXT');
    lines.push('; сюда попадаем, если переход НЕ сработал');
    lines.push('1');
    lines.push('1');
    lines.push('1');
    lines.push('БП DONE');
    lines.push('; сюда попадаем, если переход СРАБОТАЛ');
    lines.push('NEXT: 2');
    lines.push('2');
    lines.push('2');
    lines.push('DONE: П→X 9');
    lines.push('С/П');
    return lines.join('\n');
  }

  /* Восемь случаев: четыре условия, каждое выполнено и не выполнено. */
  var CASES = [
    { cond: 'F X=0',  xText: 'X = 0',     xLines: ['0'],           expect: true  },
    { cond: 'F X=0',  xText: 'X = 5',     xLines: ['5'],           expect: false },
    { cond: 'F X≠0',  xText: 'X = 5',     xLines: ['5'],           expect: true  },
    { cond: 'F X≠0',  xText: 'X = 0',     xLines: ['0'],           expect: false },
    { cond: 'F X<0',  xText: 'X = −3',    xLines: ['3', '/-/'],    expect: true  },
    { cond: 'F X<0',  xText: 'X = 5',     xLines: ['5'],           expect: false },
    { cond: 'F X≥0',  xText: 'X = 5',     xLines: ['5'],           expect: true  },
    { cond: 'F X≥0',  xText: 'X = −3',    xLines: ['3', '/-/'],    expect: false }
  ];

  var agree = 0;
  var disagree = 0;
  var broken = 0;

  CASES.forEach(function (c, idx) {
    var text = src(c.cond, c.xLines);
    var card = document.createElement('div');
    card.className = 'card';

    var h = document.createElement('h2');
    h.textContent = (idx + 1) + '. ' + c.cond + ' при ' + c.xText;
    card.appendChild(h);

    var pre = document.createElement('pre');
    pre.textContent = text;
    card.appendChild(pre);

    var res = { cond: c.cond, xText: c.xText, r9: null, acted: null, err: '' };

    var ext = makeExt();
    var r;
    try {
      r = build(ext, text);
    } catch (e) {
      res.err = 'исключение при сборке: ' + (e && e.message ? e.message : String(e));
    }

    if (!res.err) {
      if (!r.ok) {
        res.err = 'сборка не удалась: ' + r.errors.join('; ');
      } else {
        try {
          ext.core.setProgram(r.program, false);
          var run = ext.run(20000);
          if (run.err) {
            res.err = 'ЕГГ0Г на шаге ' + run.steps;
          } else if (run.result !== 'stop') {
            res.err = 'не дошло до С/П: ' + run.result + ' за ' + run.steps + ' шагов';
          } else {
            res.r9 = ext.ST.R[9];
            /* 222 — переход сработал и программа попала на NEXT.
               111 — переход не сработал и программа прошла по порядку. */
            if (res.r9 === 222) res.acted = true;
            else if (res.r9 === 111) res.acted = false;
            else res.err = 'R9 = ' + show(res.r9) + ' — ни 111, ни 222';
          }
        } catch (e) {
          res.err = 'исключение при прогоне: ' + (e && e.message ? e.message : String(e));
        }
      }
    }

    var xLine = document.createElement('div');
    xLine.className = 'x';
    xLine.innerHTML = 'R9 = <b>' + (res.r9 === null ? '—' : show(res.r9)) + '</b>' +
                      ' · ожидалось: переход <b>' + (c.expect ? 'сработает' : 'не сработает') + '</b>';
    card.appendChild(xLine);

    if (res.err) {
      broken++;
      var f = document.createElement('span');
      f.className = 'flag err';
      f.textContent = 'ПРОВЕРКА НЕ ПРОШЛА';
      card.appendChild(f);
      var e1 = document.createElement('span');
      e1.className = 'err';
      e1.textContent = res.err;
      card.appendChild(e1);

      var tr1 = document.createElement('tr');
      tr1.innerHTML = '<td>' + c.cond + '</td><td>' + c.xText + '</td>' +
                      '<td class="err" colspan="2">' + escapeHtml(res.err) + '</td>';
      tbody.appendChild(tr1);
    } else {
      var ok = (res.acted === c.expect);
      if (ok) agree++; else disagree++;

      var f2 = document.createElement('span');
      f2.className = 'flag ' + (res.acted ? 'yes' : 'no');
      f2.textContent = res.acted ? 'переход СРАБОТАЛ' : 'переход НЕ сработал';
      card.appendChild(f2);

      var tr2 = document.createElement('tr');
      var cls = res.acted ? 'yes' : 'no';
      tr2.innerHTML = '<td>' + c.cond + '</td><td>' + c.xText + '</td>' +
                      '<td class="' + cls + '">' + show(res.r9) + '</td>' +
                      '<td class="' + cls + '">' + (res.acted ? 'сработал' : 'не сработал') +
                      (ok ? '' : ' ❌ НЕ КАК ОЖИДАЛОСЬ') + '</td>';
      tbody.appendChild(tr2);
    }

    cards.appendChild(card);
  });

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var parts = [];
  parts.push('Сошлось с ожиданием: ' + agree + ' из ' + CASES.length);
  if (disagree) parts.push('расхождений: ' + disagree);
  if (broken) parts.push('не выполнилось: ' + broken);
  sum.textContent = parts.join(' · ');
  sum.className = 'sum ' + (disagree || broken ? 'bad' : 'ok');
})();
</script>
</body>
</html>
