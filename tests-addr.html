<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmk61 · тесты разбора адресов</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 12px; background: #f6f7f9; color: #1c1f24; }
  h1 { font-size: 18px; margin: 4px 0 8px; }
  .lead { font-size: 13px; color: #5b6270; margin-bottom: 12px; line-height: 1.45; }
  .sum { padding: 10px 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
         margin-bottom: 12px; background: #e7f4ec; color: #1c7a45; }
  .sum.bad { background: #fdeaea; color: #b02b2b; }
  .grp { font-size: 12px; font-weight: 700; color: #5b6270; text-transform: uppercase;
         letter-spacing: .04em; margin: 14px 0 6px; }
  .t { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px;
       padding: 9px 11px; margin-bottom: 8px; font-size: 13px; }
  .t.ok { border-left: 4px solid #33b373; }
  .t.no { border-left: 4px solid #e05252; background: #fffafa; }
  .n { font-weight: 700; color: #5b6270; }
  .name { margin: 3px 0 5px; }
  .io { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
        color: #3b4048; word-break: break-word; }
  .io b { color: #1c1f24; }
  .err { color: #b02b2b; font-size: 12px; margin-top: 4px; }
  .foot { font-size: 12px; color: #8a909c; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>

<h1>Тесты разбора адресов</h1>
<div class="lead">
  Проверяют <b>codes-addr.js</b>: правильно ли разворачивается адрес перехода,
  когда он записан одним числом, как в журналах. Ничего не рисуют — только считают.
</div>

<div id="sum" class="sum">…</div>
<div id="list"></div>

<div class="foot">
  Открывать со <code>?v=2</code>, иначе браузер покажет старую версию из кэша.
</div>

<script src="core.js?v=14"></script>
<script src="codes-addr.js?v=3"></script>
<script>
(function () {
  'use strict';

  var A = window.MKCodeAddr;
  var out = document.getElementById('list');
  var sum = document.getElementById('sum');
  var ok = 0, all = 0;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function group(title) {
    var g = document.createElement('div');
    g.className = 'grp';
    g.textContent = title;
    out.appendChild(g);
  }

  function t(n, name, input, want, opts, extra) {
    all++;
    var r = A.parse(input, opts);
    var got = A.textOf(r.bytes);
    var pass = got === want;
    if (pass) ok++;
    var d = document.createElement('div');
    d.className = 't ' + (pass ? 'ok' : 'no');
    d.innerHTML =
      '<div class="n">' + n + '</div>' +
      '<div class="name">' + esc(name) + '</div>' +
      '<div class="io">вход: <b>' + esc(input || '(пусто)') + '</b><br>' +
      'вышло: <b>' + esc(got || '(пусто)') + '</b>' +
      (pass ? '' : '<br>ждали: <b>' + esc(want) + '</b>') + '</div>' +
      (extra ? '<div class="io">' + extra + '</div>' : '') +
      (pass ? '' : '<div class="err">не совпало</div>');
    out.appendChild(d);
  }

  group('Журнальный режим: адрес одним числом');

  t(1, 'адрес одним числом: 5D 03 → 5D 00 03', '5D 03', '5D 00 03');
  t(2, 'адрес больше девяти: 5D 30 → 5D 03 00', '5D 30', '5D 03 00');
  t(3, 'отрицательный адрес: 5D -3 → 5D 0A 03', '5D -3', '5D 0A 03');
  t(4, 'адрес с полубайтом: 5D 0A 03 не ломается', '5D 0A 03', '5D 0A 03');
  t(5, 'главный случай: 5E 03 01 → адрес 03 и команда 01', '5E 03 01', '5E 00 03 01');
  t(6, 'цикл из журнала: 5E 03 01 02 51 0', '5E 03 01 02 51 0', '5E 00 03 01 02 51 00 00');
  t(7, 'обычные команды не трогаем', '01 02 03', '01 02 03');
  t(8, 'F0 21 — не переход, адрес не добавляем', 'F0 21', 'F0 21');
  t(9, 'переход на адрес 0: 51 0 → 51 00 00', '51 0', '51 00 00');
  t(10, 'переход без адреса в конце: 5D остаётся один', '5D', '5D');
  t(11, 'адрес -0 — это A0', '5D -0', '5D 0A 00');

  group('Служебные возвраты');

  (function () {
    all++;
    var r = A.parse('5D 03 5E 07');
    var f = r.fixes.map(function (x) { return x.raw + ' → ' + x.to; }).join('; ');
    var pass = f === '03 → 00 03; 07 → 00 07';
    if (pass) ok++;
    var d = document.createElement('div');
    d.className = 't ' + (pass ? 'ok' : 'no');
    d.innerHTML = '<div class="n">12</div>' +
      '<div class="name">все развёрнутые адреса видны в fixes</div>' +
      '<div class="io">fixes: <b>' + esc(f) + '</b>' +
      (pass ? '' : '<br>ждали: <b>03 → 00 03; 07 → 00 07</b>') + '</div>' +
      '<div class="io">байты: ' + A.textOf(r.bytes) + '</div>' +
      (pass ? '' : '<div class="err">не совпало</div>');
    out.appendChild(d);
  })();

  (function () {
    all++;
    var r = A.parse('5D XIIE 01');
    var got = r.bad.join(', ');
    var pass = got === 'XIIE';
    if (pass) ok++;
    var d = document.createElement('div');
    d.className = 't ' + (pass ? 'ok' : 'no');
    d.innerHTML = '<div class="n">13</div>' +
      '<div class="name">OCR-мусор попадает в bad, а не съедается молча</div>' +
      '<div class="io">bad: <b>' + esc(got || 'пусто') + '</b>' +
      (pass ? '' : '<br>ждали: <b>XIIE</b>') + '</div>' +
      '<div class="io">байты: ' + A.textOf(r.bytes) + '</div>' +
      (pass ? '' : '<div class="err">не совпало</div>');
    out.appendChild(d);
  })();

  t(14, 'пустой ввод — пустой результат', '', '');

  group('Строгий режим: адрес двумя ячейками (fixAddr: false)');

  t(15, '5D 00 03 остаётся как есть', '5D 00 03', '5D 00 03', { fixAddr: false });
  t(16, '5D 03 без разворота — прежнее поведение', '5D 03', '5D 03', { fixAddr: false });
  t(17, '5E 03 01 02 не разворачивается', '5E 03 01 02', '5E 03 01 02', { fixAddr: false });

  sum.className = 'sum' + (ok === all ? '' : ' bad');
  sum.textContent = ok + ' из ' + all + ' — ' + (ok === all ? 'все проверки прошли' : 'есть ошибки');
})();
</script>
</body>
</html>
