<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d7d3c4">
<title>ЭЛЕКТРОНИКА МК-61 — эмулятор</title>
<link rel="stylesheet" href="layout.css?v=1">
</head>
<body data-theme="classic" data-mode="study" data-tab="num">
<div class="app">
  <div class="top">
    <label for="model">Модель</label>
    <select id="model" aria-label="Модель калькулятора"></select>
    <button type="button" class="topbtn" id="themeBtn" title="Тема">▤</button>
    <button type="button" class="topbtn" id="shelfOpen" title="Библиотека программ">☰</button>
  </div>

  <div class="calc">
    <div class="brand"><span>ЭЛЕКТРОНИКА</span><span id="modelName">МК-61</span></div>

    <div class="screen">
      <div class="lcd" id="lcd">0</div>
      <div class="lcd-sub">
        <span>режим: <b id="stMode">АВТ</b></span>
        <span>слой: <b id="stLayer">—</b></span>
        <span>угол: <b id="stAngle">Г</b></span>
        <span>адрес: <b id="stStep">00</b></span>
      </div>
    </div>

    <div class="angseg" id="angseg" role="group" aria-label="Единица измерения угла, как переключатель Р-ГРД-Г">
      <span class="anglab">угол</span>
      <button type="button" data-angle="deg" title="Градусы — полный оборот 360">Г</button>
      <button type="button" data-angle="grad" title="Грады — полный оборот 400">ГРД</button>
      <button type="button" data-angle="rad" title="Радианы — полный оборот 2π">Р</button>
    </div>

    <button type="button" class="progtag" id="progTag" hidden>
      <span class="ptag-num" id="progTagNum">01</span>

  </div>
</div>

<!-- ПОРЯДОК ПОДКЛЮЧЕНИЯ ВАЖЕН.

     1. core.js → profiles.js: база ядра и коды команд.
     2. ext61.js → disasm61.js: расширение и декодер (ядро и листинг).
     3. profiles-ui.js: раскладки и список моделей, в т. ч. «МК-61 (расширенный)».
     4. ext61-boot.js: ПОСЛЕ раскладок и ДО ui.js — он смотрит выбранную
        модель, отдаёт ui.js настоящее ядро и перехватывает кнопку F0,
        возвращая клавиатуру на цифровой слой.
     5. ui.js → shelf.js → ext61-ui.js → ext61-regs-click.js:
        интерфейс, библиотека, панель F0 с банком и журналом переходов,
        регистры: одно касание — показать, двойное — записать X.
     6. asm61.js → asm-editor.js: ассемблер и панель редактора на вкладке
        «Код». Панель вставляет себя ПЕРЕД #prog и никогда внутрь: там
        renderProgram() из ui.js делает innerHTML = '', и всё вложенное
        исчезло бы при первой перерисовке. Тот же приём, у панели банков.

     ВАЖНО: версии у всех скриптов поднимаются ВМЕСТЕ. Если поднять один
     файл и забыть другой, браузер отдаст старый скрипт из кэша — и
     разъедется всё.

     ВЕРСИИ ЭТОЙ ПРАВКИ (26.11.2026):
       shelf.js   6 — импорт файла. Причина, по которой кнопка «ничего не
                     загружала», была не в коде импорта, а ЗДЕСЬ: стояла
                     версия ?v=3, браузер отдавал старый shelf.js из кэша,
                     где importLib молча ничего не находил. Поднято до 6.
                     В самом shelf.js v5 импорт кладёт каждую запись файла
                     отдельной строкой, без переименований, и честно пишет
                     в тосте, сколько добавлено; формат {app,format,
                     version,programs[]} с prog плоским списком байтов
                     разбирается как есть;
       asm-editor 14 — кнопки загрузки файла в панели ассемблера нет:
                     ей там не место. Функции импорта в файле живы;
       ui.js      4 — листинг склеивает двухбайтные команды расширения;
       ext61.js  12 — правило раскладки длинной ленты по страницам;
       asm61.js   5 — директива «.page N» и метки с номером страницы. -->
<script src="core.js?v=14"></script>
<script src="profiles.js?v=14"></script>
<script src="ext61.js?v=12"></script>
<script src="disasm61.js?v=8"></script>

<script src="profiles-ui.js?v=3"></script>
<script src="ext61-boot.js?v=10"></script>
<script src="ui.js?v=4"></script>
<script src="shelf.js?v=6"></script>
<script src="ext61-ui.js?v=10"></script>
<script src="ext61-regs-click.js?v=4"></script>
<script src="asm61.js?v=5"></script>
<script src="asm-editor.js?v=14"></script>

<script>
/* Переключатель угла Р-ГРД-Г — как в 34-й:
   ui.js про угол ничего не знает, ядро отдаёт setAngle/getAngle,
   здесь только кнопки и память. */
(function () {
  var KEY = 'pmk61/angle';
  var MARK = { deg: 'Г', grad: 'ГРД', rad: 'Р' };
  var WORD = { deg: 'градусы', grad: 'грады', rad: 'радианы' };
  var seg = document.getElementById('angseg');
  var mark = document.getElementById('stAngle');
  var cur = 'deg';
  if (!seg) return;

  function core() {
    return (window.MKUI && window.MKUI.getCore) ? window.MKUI.getCore() : null;
  }

  function paint() {
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.angle === cur);
    });
    if (mark) mark.textContent = MARK[cur];
    seg.title = 'Угол: ' + WORD[cur];
  }

  function apply(mode, silent) {
    if (!MARK[mode]) mode = 'deg';
    cur = mode;
    try { localStorage.setItem(KEY, mode); } catch (e) {}
    var c = core();
    if (c && c.setAngle) c.setAngle(mode);
    paint();
    if (!silent && window.MKUI && window.MKUI.hint) {
      window.MKUI.hint('Угол: ' + WORD[mode] + ' — sin, cos, tg и обратные считаются в этих единицах');
    }
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved && MARK[saved] ? saved : 'deg', true);

  seg.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-angle]');
    if (b) apply(b.dataset.angle);
  });

  var model = document.getElementById('model');
  if (model) {
    model.addEventListener('change', function () {
      setTimeout(function () { apply(cur, true); }, 0);
    });
  }
})();
</script>
</body>
</html>
