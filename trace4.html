<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трассировка переходов v4 · pmk61</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:12px 10px 40px;background:#111;color:#ddd}
  h1{font-size:17px;margin:0 0 6px}
  h2{font-size:14px;margin:16px 0 6px;color:#8fc}
  .sub{font-size:12px;color:#888;margin:0 0 10px;line-height:1.5}
  .tests{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tests button{background:#1e1e1e;color:#bbb;border:1px solid #3a3a3a;border-radius:6px;padding:6px 9px;font-size:12px}
  .tests button.on{background:#20402f;border-color:#3a7a55;color:#fff}
  .tests button.pass{border-color:#2f6b45}
  .tests button.fail{border-color:#7a3030;color:#e88}
  table{border-collapse:collapse;width:100%;font-size:12px;font-family:ui-monospace,monospace;margin-bottom:8px}
  th,td{border:1px solid #2e2e2e;padding:2px 5px;text-align:right;white-space:nowrap}
  th{background:#1b1b1b;color:#999;font-weight:normal}
  td.l{text-align:left}
  tr.jump{background:#3d3410}
  tr.cond{background:#102b40}
  tr.err{background:#401414}
  .mem{font-family:ui-monospace,monospace;font-size:11px;color:#777;word-break:break-all;line-height:1.8}
  .ok{color:#6c6}.bad{color:#e77}
  .card{border:1px solid #2e2e2e;border-radius:8px;padding:8px 10px;margin-bottom:12px}
  .verdict{font-size:13px;margin:6px 0 10px}
  .note{font-size:12px;color:#999;line-height:1.55}
  details summary{cursor:pointer;font-size:12px;color:#8fc;margin:6px 0}
</style>
</head>
<body>
<h1>Трассировка переходов v4</h1>
<p class="sub">Каждый тест собирается, грузится в настоящее ядро <code>MKCore.create()</code> из core.js
и прогоняется шаг за шагом через <code>step()</code>. Ничего не имитируется: листинг, журнал и итог
получены из живого состояния <code>ST</code>.</p>
<div id="sum" class="verdict"></div>
<div class="tests" id="tabs"></div>
<div id="out"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';

  var JUMPS = [0x51, 0x53, 0x57, 0x59, 0x5C, 0x5E, 0x5D, 0x5B, 0x58, 0x5A];
  var COND  = [0x57, 0x59, 0x5C, 0x5E, 0x5D, 0x5B, 0x58, 0x5A];
  function isJump(c) { return JUMPS.indexOf(c) >= 0; }
  function isCond(c) { return COND.indexOf(c) >= 0; }
  function hex(c) { return (c & 255).toString(16).toUpperCase().padStart(2, '0'); }

  function makeCore() {
    return MKCore.create({
      progLen: 105, regCount: 15, nop: 0x54, maxDig: 8, hasK: true,
      addrHigh: true, addrHighFirst: 100, addrHighLast: 104, angle: 'deg'
    });
  }

  // Программа задаётся списком кодов; 0x54 = пустой шаг.
  function fill(list) {
    var p = new Array(105).fill(0x54);
    list.forEach(function (c, i) { if (c != null) p[i] = c; });
    return p;
  }

  // ---- восемь условий + безусловный переход, подпрограмма и цикл ----
  // Общая схема условия: набрать X, F-переход NEXT, ветка «111», БП DONE,
  // метка NEXT: «222», метка DONE: П→X 9, С/П. R9 = 111 записан заранее.
  function condCase(code, digits, sign) {
    var l = [
      0x01, 0x01, 0x01,             // 0-2: X = 111
      0x49,                         // 3: X→П 9
      0x00                          // 4: заготовка под цифру
    ];
    // цифры, задающие X
    digits.forEach(function (d, i) { l[4 + i] = d; });
    var at = 4 + digits.length;
    if (sign) { l[at] = 0x0B; at++; }        // /-/
    l[at] = code;                             // команда условия
    l[at + 1] = 0x01;                         // адрес 14: десятки
    l[at + 2] = 0x04;                         // единицы
    at += 3;
    // ветка «условие выполнено» -> 111
    l[at] = 0x01; l[at + 1] = 0x01; l[at + 2] = 0x01; at += 3;
    l[at] = 0x51; l[at + 1] = 0x02; l[at + 2] = 0x00; at += 3; // БП 20
    // сюда прыгает ложное условие (адрес 14 = «222»)
    l[14] = 0x02; l[15] = 0x02; l[16] = 0x02;
    l[17] = 0x69;                 // П→X 9
    l[18] = 0x50;                 // С/П
    l[20] = 0x69;                 // П→X 9
    l[21] = 0x50;                 // С/П
    return l;
  }

  var CASES = [
    { n: 1, t: 'F X=0 · X=0',        prog: condCase(0x5E, [0x00]),                 exp: 111, cond: 'истина' },
    { n: 2, t: 'F X=0 · X=5',        prog: condCase(0x5E, [0x05]),                 exp: 222, cond: 'ложь' },
    { n: 3, t: 'F X≠0 · X=5',        prog: condCase(0x57, [0x05]),                 exp: 111, cond: 'истина' },
    { n: 4, t: 'F X≠0 · X=0',        prog: condCase(0x57, [0x00]),                 exp: 222, cond: 'ложь' },
    { n: 5, t: 'F X<0 · X=−3',       prog: condCase(0x5C, [0x03], true),           exp: 111, cond: 'истина' },
    { n: 6, t: 'F X<0 · X=5',        prog: condCase(0x5C, [0x05]),                 exp: 222, cond: 'ложь' },
    { n: 7, t: 'F X≥0 · X=5',        prog: condCase(0x59, [0x05]),                 exp: 111, cond: 'истина' },
    { n: 8, t: 'F X≥0 · X=−3',       prog: condCase(0x59, [0x03], true),           exp: 222, cond: 'ложь' },
    {
      n: 9, t: 'БП через пропуск',
      prog: fill([0x05, 0x51, 0x02, 0x00, 0x02, 0x02, 0x02, null, null, null,
                  null, null, null, null, null, null, null, null, null, null,
                  0x07, 0x50]),
      exp: 7, cond: 'безусловный'
    },
    {
      n: 10, t: 'ПП / В/О',
      prog: fill([0x05, 0x53, 0x00, 0x08, 0x50, null, null, null, 0x07, 0x52]),
      exp: 7, cond: 'подпрограмма'
    },
    {
      n: 11, t: 'Цикл F L0 ×3',
      prog: fill([
        0x03, 0x40,             // 0-1: 3 → R0
        0x00, 0x49,             // 2-3: 0 → R9
        0x01, 0x69, 0x10, 0x49, // 4-7: R9 = R9 + 1
        0x5D, 0x00, 0x04,       // 8-10: F L0 → 04
        0x69, 0x50              // 11-12: П→X 9, С/П
      ]),
      exp: 3, cond: 'петля'
    },
    {
      n: 12, t: 'В/О на пустом стеке',
      prog: fill([0x52, 0x07, 0x50]),
      exp: 7, cond: 'по документу — БП 01',
      note: 'Документ: «стек адресов возврата вначале нулевой, поэтому сразу после включения В/О эквивалентна БП 01». Значит должно выполниться «7» и остановка. Если счётчик шагов упёрся в лимит — ядро возвращает ip = 0 и зацикливается; это расхождение с документом, а не с книгой.'
    }
  ];

  var results = [];
  var cur = 0;

  function listing(prog) {
    var rows = [], i = 0;
    while (i < 105) {
      var c = prog[i];
      if (c === 0x54) {
        var start = i;
        while (i < 105 && prog[i] === 0x54) i++;
        rows.push({ addr: String(start), src: '(пусто ×' + (i - start) + ')', code: '', empty: true });
        continue;
      }
      if (isJump(c)) {
        var a = prog[i + 1], b = prog[i + 2];
        var addr = (a === 0x0A) ? ('-' + b) : (a * 10 + b);
        rows.push({ addr: String(i), src: MKCore.cmdName(c, 15) + ' ' + addr,
                    code: hex(c) + ' ' + hex(a) + ' ' + hex(b), jump: true });
        i += 3;
      } else {
        rows.push({ addr: String(i), src: MKCore.cmdName(c, 15), code: hex(c) });
        i += 1;
      }
    }
    return rows;
  }

  function trace(prog) {
    var core = makeCore();
    core.setProgram(fill([]), false);
    core.setProgram(prog, false);
    core.reset(true);
    var jr = [], res = 'cont', n = 0;
    while (n < 120) {
      var ip = core.ST.ip;
      var code = core.ST.prog[ip];
      var x0 = core.ST.X, y0 = core.ST.Y, r90 = core.ST.R[9], sub0 = core.ST.sub.length;
      res = core.step();
      n++;
      jr.push({
        n: n, ip: ip, code: code, name: MKCore.cmdName(code, 15),
        x0: x0, y0: y0, r90: r90, sub0: sub0,
        x1: core.ST.X, y1: core.ST.Y, r91: core.ST.R[9], sub1: core.ST.sub.length,
        ip1: core.ST.ip, res: res
      });
      if (res === 'stop' || res === 'error') break;
    }
    return { jr: jr, res: res, core: core, n: n };
  }

  function runAll() {
    results = CASES.map(function (c) {
      var prog = fill(c.prog);
      var r = trace(prog);
      var lastX = r.jr.length ? r.jr[r.jr.length - 1].x1 : 0;
      var pass = (r.res === 'stop' && lastX === c.exp);
      return { c: c, prog: prog, r: r, lastX: lastX, pass: pass };
    });
  }

  function render() {
    var r = results[cur], c = r.c, jr = r.r.jr;
    var h = '';

    h += '<div class="card">';
    h += '<h2>' + c.n + '. ' + c.t + '</h2>';
    h += '<div class="verdict ' + (r.pass ? 'ok' : 'bad') + '">' +
         (r.pass ? '✔ совпало' : '✘ не совпало') +
         ' — X = ' + r.lastX + ', ожидалось ' + c.exp +
         '; условие в программе: ' + c.cond +
         '; шагов ' + jr.length +
         '; итог шага: ' + r.r.res + '</div>';
    if (c.note) h += '<div class="note">' + c.note + '</div>';
    h += '</div>';

    h += '<h2>Листинг</h2><table><tr><th>Адр</th><th>Запись</th><th>Коды</th></tr>';
    listing(r.prog).forEach(function (row) {
      var cls = row.jump ? ' class="cond"' : '';
      h += '<tr' + cls + '><td>' + row.addr + '</td><td class="l">' + row.src +
           '</td><td>' + row.code + '</td></tr>';
    });
    h += '</table>';

    h += '<h2>Память (первые 40 ячеек)</h2><div class="mem">';
    var m = [];
    for (var i = 0; i < 40; i++) m.push(hex(r.prog[i]));
    h += m.join(' ') + '</div>';

    h += '<h2>Журнал</h2><table>' +
         '<tr><th>Шаг</th><th>ip</th><th>Код</th><th>Команда</th>' +
         '<th>X до</th><th>Y до</th><th>R9 до</th><th>стек</th>' +
         '<th>X пос</th><th>Y пос</th><th>R9 пос</th><th>стек</th><th>ip пос</th><th>шаг</th></tr>';
    jr.forEach(function (j) {
      var cls = '';
      if (j.res === 'error') cls = 'err';
      else if (j.ip1 !== j.ip + 1) cls = 'jump';
      else if (isCond(j.code) || isJump(j.code)) cls = 'cond';
      h += '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' +
        '<td>' + j.n + '</td><td>' + j.ip + '</td><td>' + hex(j.code) + '</td>' +
        '<td class="l">' + j.name + '</td>' +
        '<td>' + j.x0 + '</td><td>' + j.y0 + '</td><td>' + j.r90 + '</td><td>' + j.sub0 + '</td>' +
        '<td>' + j.x1 + '</td><td>' + j.y1 + '</td><td>' + j.r91 + '</td><td>' + j.sub1 + '</td>' +
        '<td><b>' + j.ip1 + '</b></td><td>' + j.res + '</td></tr>';
    });
    h += '</table>';

    h += '<details><summary>Что значат цвета</summary><div class="note">' +
         'Синяя строка — команда перехода или условия. Жёлтая — ip ушёл не на +1, то есть был прыжок. ' +
         'Красная — ядро вернуло ошибку. Колонка «шаг» — что вернул step(): cont (следующая), ' +
         'jump (переход), stop (С/П), error (ЕГГ0Г).</div></details>';

    document.getElementById('out').innerHTML = h;
  }

  function renderTabs() {
    var box = document.getElementById('tabs');
    box.innerHTML = '';
    results.forEach(function (r, i) {
      var b = document.createElement('button');
      b.textContent = r.c.n + '. ' + r.c.t;
      if (i === cur) b.className = 'on';
      else b.className = r.pass ? 'pass' : 'fail';
      b.onclick = function () { cur = i; renderTabs(); render(); };
      box.appendChild(b);
    });
  }

  function renderSum() {
    var pass = results.filter(function (r) { return r.pass; }).length;
    var el = document.getElementById('sum');
    el.innerHTML = 'Прошло <b>' + pass + '</b> из <b>' + results.length + '</b>. ' +
      (pass === results.length ? 'Все тесты зелёные.' :
        'Красные вкладки — расхождения, открой их и посмотри журнал.');
  }

  try {
    runAll();
    renderSum();
    renderTabs();
    render();
  } catch (e) {
    document.getElementById('out').innerHTML =
      '<div class="card bad"><b>Ошибка страницы:</b><br>' + (e && e.message ? e.message : e) +
      '<br><span class="note">Ядро core.js не подключилось или API отличается. ' +
      'Текст выше — настоящая ошибка браузера.</span></div>';
  }
})();
</script>
</body>
</html>
